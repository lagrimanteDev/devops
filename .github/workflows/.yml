name: Deploy do Meu Projeto

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Auditoria antes do checkout
        run: |
          ls -R
          echo "Todos os arquivos foram carregados no Runner!"

      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Auditoria apos o checkout
        run: |
          ls -R
          echo "Arquivos HTML encontrados:"
          find . -name "*.html" | wc -l

      - name: Validar sintaxe do HTML
        run: npx --yes htmlhint "**/*.html"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
