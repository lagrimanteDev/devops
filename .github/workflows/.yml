name: Deploy do Meu Projeto

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  auditoria:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Validar sintaxe do HTML
        run: npx --yes htmlhint index.html

      - name: Checar arquivos estaticos
        run: |
          ls -R
          echo "Todos os arquivos foram carregados no Runner!"
